<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Последние обновлённые проекты</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet" />
    <link rel='stylesheet' type='text/css' href='index.css'>
</head>
<body>
    <!-- панелька слева -->
    <div class="sidebar">
        <a href="#" class="nav-item active" id="homeLink" data-page="home">
            <span class="material-symbols-outlined">home</span>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item" id="projectsLink" data-page="projects">
            <span class="material-symbols-outlined">folder</span>
            <span>Projects</span>
        </a>
        <!-- <a href="#" class="nav-item" id="telegramLink" data-page="telegram">
            <span class="material-symbols-outlined">send</span>
            <span>Telegram</span>
        </a> -->
    </div>

    <!-- заголовок -->
    <div class="header">
        <h1 id="pageTitle">Главная страница</h1>
    </div>

    <!-- контент на странице -->
    <div class="main-content">
        <!-- домашняя страница -->
        <div class="page active" id="homePage">
            <div class="welcome-section">
                <h2>Да</h2>
                <p>Даже после обновления сайта я всё ещё не решил что сюда добавлю</p>
            </div>
        </div>

        <!-- страница с проектами -->
        <div class="page" id="projectsPage">
            <!-- поиск -->
            <div class="search-bar">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" id="searchInput" placeholder="Поиск проектов...">
                <button id="refreshBtn" class="refresh-btn" title="Обновить проекты">
                    <span class="material-symbols-outlined">refresh</span>
                </button>
            </div>

            <!-- прикольная загрузка -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Загрузка проектов из GitHub...</p>
            </div>

            <!-- сетка с проектами -->
            <div class="projects-grid" id="projectsGrid">
                
            </div>

            <!-- это если ничего не найдено -->
            <div class="not-found" id="notFound">
                <span class="material-symbols-outlined">search_off</span>
                <p>Проекты не найдены</p>
            </div>
        </div>

        <!-- хотел добавить страницу с телеграмом но перехотел -->
        <div class="page" id="telegramPage">
            <div class="welcome-section">
                <h2>Чё</h2>
                <p>Это вкладки не должно было существовать</p>
            </div>
        </div>

        <!-- здесь страница с проектом генерируется -->
        <div id="dynamicPages"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
